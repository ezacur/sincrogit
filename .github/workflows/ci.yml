name: CI

# SincroGit targets Windows (the shadow-model git plumbing, the named-mutex
# single-instance guard and the winotify toasts are all Windows-specific), so
# the suite runs on windows-latest — the only platform the product supports.

on:
  push:
    branches: [main]
    tags: ["v*"]        # a tag also publishes a release (see the `release` job)
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (runtime + dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        # QT_QPA_PLATFORM=offscreen lets the PyQt5 GUI tests run headless; conftest
        # also sets it, but exporting here keeps a bare `pytest` honest too.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Check bilingual docs are structurally in sync
        run: python tools/check_docs_parity.py

  # The product SHIPS as the PyInstaller exe, so a green test suite isn't enough:
  # a missing hidden import (watchdog submodules, winotify, python-pptx) or a bad
  # bundle only shows up in the frozen exe. Build it and run a read-only one-shot.
  # `status` is a deep smoke: __main__ imports the engine at module load, which
  # pulls in watchdog/ai/convert, so a broken core bundle crashes here. (The Qt
  # GUI is lazily imported and can't run headless, so it stays out of this gate.)
  smoke-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (runtime + gui/pptx + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Build the portable exe (onedir/fast)
        shell: pwsh
        run: ./build.ps1 -Fast

      - name: Smoke-test the built exe (read-only `status` must exit 0)
        shell: pwsh
        run: |
          # A minimal, complete config so the CLI resolves one (it never creates
          # a default itself — only the tray does). No repos -> status exits 0.
          @"
          defaults: {}
          ai:
            mode: none
          log:
            file: smoke.log
          repos: []
          "@ | Set-Content -Encoding utf8 smoke.config.yaml
          # Word form must be argv[0] (it remaps to --status), so `status` leads.
          $out = & "dist\SincroGit\SincroGit.exe" status --config smoke.config.yaml 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "exit=$code output=<$out>"
          if ($code -ne 0) { Write-Error "smoke: 'status' exited $code (bundle broken?)"; exit 1 }
          # Do NOT assert on stdout. This is a --noconsole (windowed) build: what
          # its CLI output reaches depends on whether a console can be attached,
          # and a headless runner has none. Asserting the text made this job fail
          # for every commit while the bundle was in fact fine. The log file is the
          # stdout-independent proof that Python really ran: main() calls
          # setup_logging BEFORE dispatching, and RotatingFileHandler opens the
          # file on construction.
          if (-not (Test-Path smoke.log)) {
            Write-Error "smoke: no smoke.log — the bundle exited 0 without running setup_logging"
            exit 1
          }
          # Text is signal, not a gate: report it loudly if it is missing, but do
          # not block a release on something the runner's console setup can change.
          if ($out -notmatch "No repos configured") {
            Write-Warning "smoke: exit 0 and log written, but stdout did not reach us"
          }
          Write-Host "==> Smoke test passed: the frozen exe ran a CLI one-shot (exit 0, log written)."

  # Publish the artifact the user actually runs. Triggered ONLY by a `v*` tag.
  #
  # This is also what closes the gap the smoke test above cannot: smoke-build
  # compiles --onedir (fast), while the thing people run is --onefile. Here the
  # release binary is built with the same build.ps1 the maintainer uses, but on a
  # clean runner instead of one laptop — so the published exe is reproducible from
  # the tag, and `SincroGit.exe --version` on any machine identifies it.
  #
  # The .sha256 sidecar is not decoration: the in-app "Update and relaunch"
  # verifies the download against it and refuses to install a mismatch, and it is
  # how two builds of the same `__version__` are told apart (see updater.py).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke-build]     # never publish something that failed its tests
    runs-on: windows-latest
    permissions:
      contents: write              # required to create the release and upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (runtime + gui/pptx + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Build the release exe (onefile — the shipped shape)
        shell: pwsh
        run: ./build.ps1

      - name: Verify it runs, and record what was built
        shell: pwsh
        run: |
          $exe = "dist\SincroGit.exe"
          if (-not (Test-Path $exe)) { Write-Error "build produced no $exe"; exit 1 }
          # --version needs no config, so it is the cheapest proof the bundle works.
          # It MUST be piped: this is a GUI-subsystem (--noconsole) binary, and
          # PowerShell does not wait for one of those — a bare `& $exe` returns
          # immediately, leaving $LASTEXITCODE unset, which then compares
          # non-zero and failed this step on a perfectly good build. Piping makes
          # PowerShell read stdout to EOF, so it waits and reports the real code.
          $out = & $exe --version 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "exit=$code output=<$out>"
          if ($code -ne 0) { Write-Error "--version exited $code (bundle broken?)"; exit 1 }
          if ($out -notmatch "sincrogit ") {
            Write-Warning "--version produced no recognizable output"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # `<digest>  <name>` — the sha256sum format updater.py also accepts.
          "$hash  SincroGit.exe" | Set-Content -Encoding ascii "$exe.sha256"
          Write-Host "sha256: $hash"

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "dist\SincroGit.exe" "dist\SincroGit.exe.sha256" `
            --title "SincroGit $tag" `
            --generate-notes `
            --verify-tag
