[project]
name = "sincrogit"
dynamic = ["version"]  # single source of truth: sincrogit.__version__
description = "Automatic, instant synchronization with robust Git versioning"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=3.0",
    "PyYAML>=6.0",
    "pathspec>=0.10",
    # Desktop toasts (conflict/handoff/nudge alerts). Optional at runtime
    # (notify.py degrades to log-only) but without it the feature never fires,
    # so it ships by default on the target platform.
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
pptx = ["python-pptx>=1.0"]  # readable .pptx previews/diffs (optional, like pandoc)
dev = ["pytest>=7", "PyQt5>=5.15", "python-pptx>=1.0"]

[project.scripts]
sincrogit = "sincrogit.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sincrogit", "sincrogit.gui"]

[tool.setuptools.dynamic]
version = {attr = "sincrogit.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
