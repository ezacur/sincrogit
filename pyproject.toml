[project]
name = "sincrogit"
version = "0.1.0"
description = "Automatic, instant synchronization with robust Git versioning"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=3.0",
    "PyYAML>=6.0",
    "pathspec>=0.10",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
pptx = ["python-pptx>=1.0"]  # readable .pptx previews/diffs (optional, like pandoc)
dev = ["pytest>=7", "PyQt5>=5.15", "python-pptx>=1.0"]

[project.scripts]
sincrogit = "sincrogit.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sincrogit", "sincrogit.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
