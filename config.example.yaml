# SincroGit — example configuration.
# Copy this file to config.yaml and adjust the 'repos' list.
#
# Disabling: any interval/size below can be turned OFF with `inf` (or off/none/never)
# -> the action never fires / the limit is unlimited. Headline use: `seal_interval_min:
# inf` = PURIST MODE (no auto-seal; you commit by hand with Smart Commit). WARNING:
# `max_file_bytes: inf` removes the size guard and may auto-commit huge files forever —
# prefer a high explicit number unless you truly mean "no limit". See the README.

defaults:
  snapshot_interval_sec: 300      # how often the WIP (Work In Progress) is amended (5 min)
  debounce_sec: 25                # wait after the last change before a snapshot
  seal_interval_min: 360          # "real" permanent commit + push every 6h ("inf" = purist mode)
  pull_interval_min: 10           # fetch every 10 min; pull only if there's something new
  max_file_bytes: 1048576         # 1 MB: only text below this size is versioned
  push: true                      # push sealed commits to the remote
  pull: true                      # periodic pull from the remote (WIP rebase)
  git_timeout_sec: 60             # limit for network operations (fetch/push)
  autosnap: true                  # live mirror of HEAD (incl. WIP) to a side ref on the
                                  # remote -> disk-failure recovery within autosnap_interval
  autosnap_interval_min: 30       # force-push the mirror every 30 min (only if it changed)
  live_handoff: true              # auto-pick up your OTHER machine's live WIP (fast-forward
                                  # only; notify on divergence, never auto-merge). Needs
                                  # autosnap on. See the README's handoff section.
  extra_excludes:                 # in addition to the text/size filter (.gitignore style)
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
    - "**/dist/**"
    - "**/build/**"
  extra_includes: []              # version these binary files too (opt-in), e.g. Word docs.
  #   - "**/*.docx"               #   with pandoc (see pandoc_path) their diffs are readable
  max_include_bytes: 26214400     # 25 MB size cap for extra_includes

# Path to pandoc, for readable diffs of .docx and similar (machine-specific).
# "pandoc" if on PATH; otherwise a full path, e.g. C:/Dropbox/Accesories/pandoc.exe
pandoc_path: pandoc

# AI configuration for commit messages when sealing.
ai:
  mode: hybrid                    # hybrid | local | cloud | none
  cloud_provider: gemini
  cloud_model: gemini-2.5-flash-lite   # free Flash (2026). Alt: gemini-2.5-flash
  cloud_send_content: false       # false => only names + --stat go to the cloud (privacy)
  api_key_env: SINCROGIT_GEMINI_KEY  # env var holding the API key (never here)
  ollama_url: http://localhost:11434
  ollama_model: llama3.2          # local Ollama model (if installed)
  timeout_sec: 30
  max_diff_chars: 6000            # max amount of diff to send to the model

log:
  file: sincrogit.log
  level: DEBUG                    # DEBUG | INFO | WARNING | ERROR

repos:
  - path: "C:/path/to/your/repo"
    remote: origin
    branch: main
    # Optional per-repo overrides, e.g.:
    # seal_interval_min: 60
